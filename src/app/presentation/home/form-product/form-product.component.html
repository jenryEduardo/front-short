<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow-lg">
  <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Agregar Producto</h2>

  <form (ngSubmit)="agregarProducto()" class="space-y-4">
    <!-- Campo Nombre -->
    <div>
      <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
      <input
        id="nombre"
        type="text"
        [(ngModel)]="producto.Nombre"
        name="nombre"
        class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none transition"
        placeholder="Ej. Laptop Gamer"
        required>
    </div>

    <!-- Campo Precio -->
    <div>
      <label for="precio" class="block text-sm font-medium text-gray-700">Precio</label>
      <input
        id="precio"
        type="number"
        [(ngModel)]="producto.Precio"
        name="precio"
        class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none transition"
        placeholder="Ej. 1500"
        required>
    </div>

    <!-- Botón -->
    <button type="submit"
      class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600 transition font-semibold">
      Agregar Producto
    </button>
  </form>
</div>
