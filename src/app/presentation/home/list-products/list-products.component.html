<table class="min-w-full bg-white border border-gray-300 shadow-lg rounded-lg">
  <thead class="bg-gray-200">
    <tr>
      <th class="px-6 py-3 text-left text-gray-700 font-semibold">Nombre</th>
      <th class="px-6 py-3 text-left text-gray-700 font-semibold">Precio</th>
      <th class="px-6 py-3 text-left text-gray-700 font-semibold">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of products" class="border-b hover:bg-gray-100 transition">
      <td class="px-6 py-4 text-gray-800">{{ item.Nombre }}</td>
      <td class="px-6 py-4 text-gray-800">${{ item.Precio }}</td>
      <td class="px-6 py-4">
        <button (click)="actualizarProducto(item.Id)"
                class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition mr-2">
          Actualizar
        </button>
        <button (click)="eliminarProducto(item.Nombre)"
                class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
          Eliminar
        </button>
      </td>
    </tr>
  </tbody>
</table>
